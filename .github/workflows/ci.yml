name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: Build container image
        run: docker build -t agent-studio-backend:${{ github.sha }} .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Placeholders wired now so future stages append cleanly instead of being
  # bolted on later. Not yet functional — no security-scan tool or
  # container registry has been selected/configured.
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - run: echo "TODO Sprint 1: wire dependency/SCA + SAST + container scan"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "TODO once AWS account/environment + Terraform state are set up"
